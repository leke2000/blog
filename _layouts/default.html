<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; max-width: 920px; margin: 0 auto; padding: 0 20px; color: #1f2328; background: #fff; }
      header, footer { border-bottom: 1px solid #d0d7de; padding: 16px 0; margin-bottom: 32px; }
      header a.site-title { font-weight: 600; font-size: 1.4em; color: #0969da; text-decoration: none; }
      nav a { margin-right: 14px; color: #57606a; text-decoration: none; }
      nav a:hover { color: #0969da; }
      h1, h2, h3, h4 { color: #1f2328; margin-top: 1.6em; }
      h1 { border-bottom: 2px solid #d0d7de; padding-bottom: 8px; }
      h2 { border-bottom: 1px solid #d0d7de; padding-bottom: 4px; }
      code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 0.92em; }
      pre { background: #f6f8fa; padding: 14px; border-radius: 6px; overflow-x: auto; line-height: 1.5; }
      pre code { background: transparent; padding: 0; }
      blockquote { border-left: 4px solid #d0d7de; margin: 0; padding: 4px 16px; color: #57606a; background: #f6f8fa; }
      table { border-collapse: collapse; margin: 16px 0; }
      th, td { border: 1px solid #d0d7de; padding: 6px 12px; text-align: left; }
      th { background: #f6f8fa; }
      img { max-width: 100%; height: auto; border: 1px solid #d0d7de; border-radius: 4px; }
      .post-meta { color: #57606a; font-size: 0.9em; margin-bottom: 24px; }
      .post-list { list-style: none; padding: 0; }
      .post-list li { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #eaeef2; }
      .post-list .date { color: #57606a; font-size: 0.85em; margin-right: 12px; }
      .tag { background: #ddf4ff; color: #0969da; padding: 2px 8px; border-radius: 12px; font-size: 0.78em; margin-right: 4px; }
    </style>
  </head>
  <body>
    <header>
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav style="float:right">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer style="margin-top:60px;padding-top:20px;color:#57606a;font-size:0.85em;text-align:center;">
      © {{ site.time | date: '%Y' }} {{ site.author }} · 用 Jekyll + GitHub Pages 搭建
    </footer>
  </body>
</html>
