# 站点配置（Jekyll + GitHub Pages）
title: 实施工程师的排障手记
tagline: Arthas、tcpdump、Wireshark、magic-api 同步脚本的实操记录
description: >
  一位医疗信息化实施工程师的内训周总结：从火焰图到抓包分析，
  把现场排障的真实过程写成可复现的笔记。
author: leke2000
email: 1793023565@qq.com

# 用 GitHub Pages 默认主题（不依赖第三方 gem，构建最稳）
# 因为我们有自己的 _layouts/default.html，不需要 minima

# GitHub Pages 关键项
baseurl: "/blog"
url: "https://leke2000.github.io"

# markdown 与高亮
markdown: kramdown
highlighter: rouge

# 永久链接格式
permalink: /:year/:month/:day/:title/

# 不需要 jekyll 构建插件
plugins: []

# 排除不要的文件（避免被当成文章）
exclude:
  - push-to-github.ps1
  - push-to-github.sh
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# 文章摘要分隔符
excerpt_separator: "<!--more-->"

# 站点社交
github_username: leke2000
